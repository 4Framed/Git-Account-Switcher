[package]
name = "gas"
version = "0.1.0"
edition = "2024"
description = "Git account switcher with a push/commit leak guard"
license = "MIT"
keywords = ["git", "github", "accounts", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
